name: Deploy faculty website
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: faculty-website-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required site files
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/script.js
          test -s site/assets/Yatharth-Singhal-CV.pdf
          test -f site/.nojekyll
      - name: Deploy static website
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
